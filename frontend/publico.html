<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil — HwangHon Sports System</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script type="module" src="js/publico.js"></script>
</head>
<body>
    <a class="enlace-saltar" href="#contenido">Saltar al contenido</a>
    <div class="estructura">
        <aside class="menu-lateral" id="menu-lateral">
            <div class="cabecera-menu">
                <p class="titulo-sistema">HwangHon</p>
                <button type="button" class="boton boton-secundario boton-pequeno boton-menu" id="boton-menu"
                        aria-expanded="false" aria-controls="cuerpo-menu">Menú</button>
            </div>
            <div class="cuerpo-menu" id="cuerpo-menu">
                <!-- Los grupos y secciones se arman desde js/publico.js. -->
                <nav aria-label="Secciones de mi perfil" id="lista-menu"></nav>
            </div>
        </aside>

        <div class="columna-principal">
            <header class="cabecera-perfil">
                <div>
                    <p class="nombre-perfil" id="nombre-usuario"></p>
                    <p class="datos-perfil" id="datos-perfil"></p>
                </div>
                <button type="button" class="boton boton-secundario" id="boton-salir">Salir</button>
            </header>
            <main class="contenido" id="contenido" tabindex="-1">
                <p class="cargando" role="status">Cargando…</p>
            </main>
        </div>
    </div>
</body>
</html>
